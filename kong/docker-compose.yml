version: '3.8'

services:
  kong-database:
    image: postgres:13
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5432:5432"
    volumes:
      - ./kong-database-data:/var/lib/postgresql/data
    networks:
      - kong-net

  kong-migrations:
    image: kong:latest
    container_name: kong-migrations
    depends_on:
      - kong-database
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for database connection and bootstrapping...';
        until kong migrations bootstrap; do
          echo 'Database not ready yet, retrying in 2 seconds...';
          sleep 2;
        done;
        echo 'Database is ready!';
        kong migrations bootstrap &&
        kong migrations up &&
        kong migrations finish
      "
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    networks:
      - kong-net
    restart: "no"

  kong:
    image: kong:latest
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PG_TIMEOUT: 60        # <-- aqui: tempo para aguardar o banco responder
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    depends_on:
      - kong-database
      - kong-migrations
    networks:
      - kong-net

  konga:
    build:
      context: ./konga-pg13-v3
    image: konga-postgres13
    container_name: konga
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TOKEN_SECRET: some_secret_token
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga_db
      DB_SSL: "false"
      KONGA_HOOK_TIMEOUT: 120000
      KONGA_SEED_DB: "true"  # APENAS NA PRIMEIRA VEZ
    ports:
      - "1337:1337"
    depends_on:
      - kong-database
    networks:
      - kong-net

networks:
  kong-net:
    driver: bridge

volumes:
  kong-database-data: